          $ref: '#/components/schemas/CrupdateJob'
    CrupdateWarehouse:
      required:
        - name
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "wh_001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Entrepôt Nord"
        description:
          type: string
          example: "Entrepôt principal pour le chantier de Lyon"
        job_id:
          type: string
          example: "job_001"

    # =========================
