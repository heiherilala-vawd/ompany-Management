spring.application.name=demo2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:00001111}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC+3
spring.jackson.time-zone=Indian/Antananarivo
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret.key=${JWT_SECRET_KEY:your-secret-key-at-least-256-bits-long-for-hs256-algorithm}
jwt.expiration.time=${JWT_EXPIRATION_TIME:86400000}

# Security
security.bcrypt.strength=${SECURITY_BCRYPT_STRENGTH:10}

# Sentry (must be overridden via env vars in production)
sentry.dsn=${SENTRY_DSN:}
env=${ENV:development}