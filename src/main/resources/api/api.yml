openapi: 3.0.3
info:
  version: '1.0'
  title: Company Management API
  description: |
    API CRUD pour la gestion des entreprises, chantiers, entrepôts, équipements, matériaux,
    mouvements financiers, dépenses, achats et frais de transport.
    Basée sur le schéma de base de données fourni.

servers:
  - url: 'https://api-dev.company.com'
  - url: 'https://api-prod.company.com'

security:
  - BearerAuth: [ ]

x-tagGroups:
  - name: Features
    tags:
      - Health
      - Auth
      - Company
      - Users
      - Job
      - Team
      - Department
      - Warehouse
      - Equipment
      - Maintenance
      - Material
      - MaterialWarehouse
      - Supplier
      - Organization
      - PurchaseOrder
      - Task
      - TaskSchedule
      - Expense
      - Income
      - Loan
      - LoanRepayment
      - TravelExpense
      - Purchase
      - BankFee
      - OtherExpense
      - EmployeePayment
      - TravelPeople
      - TravelMaterials
      - TravelEquipment
      - History
      - CompanyFixedCost
      - CashAccount
      - CashTransaction
      - BudgetLine
      - EquipmentUsage
      - MaterialConsumption
      - HR
  - name: Types & Config
    tags:
      - IncomeType
      - OtherExpenseType
      - IncomeReceipt
  - name: Actions
    tags:
      - PurchaseOperation
      - TravelOperation
  - name: Dashboard
    tags:
      - Report

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication & current user
  - name: Company
    description: Company CRUD
  - name: Users
    description: User management CRUD
  - name: Job
    description: Job (project) CRUD
  - name: Team
    description: Team CRUD
  - name: Department
    description: Department CRUD
  - name: Warehouse
    description: Warehouse CRUD
  - name: Equipment
    description: Equipment CRUD
  - name: Maintenance
    description: Equipment maintenance CRUD
  - name: Material
    description: Material CRUD
  - name: MaterialWarehouse
    description: Material stock per warehouse CRUD
  - name: Supplier
    description: Supplier CRUD
  - name: Organization
    description: Organization CRUD
  - name: PurchaseOrder
    description: Purchase order CRUD
  - name: Task
    description: Task CRUD
  - name: TaskSchedule
    description: Task schedule CRUD
  - name: Expense
    description: Expense CRUD
  - name: Income
    description: Income CRUD
  - name: Loan
    description: Loan CRUD
  - name: LoanRepayment
    description: Loan repayment CRUD
  - name: TravelExpense
    description: Travel expense CRUD
  - name: Purchase
    description: Purchase CRUD
  - name: BankFee
    description: Bank fee CRUD
  - name: OtherExpense
    description: Other expense CRUD
  - name: EmployeePayment
    description: Employee payment CRUD
  - name: TravelPeople
    description: People transported on travel
  - name: TravelMaterials
    description: Materials transported on travel
  - name: TravelEquipment
    description: Equipment transported on travel
  - name: History
    description: Modification history
  - name: CompanyFixedCost
    description: Company fixed costs CRUD
  - name: CashAccount
    description: Cash account CRUD
  - name: CashTransaction
    description: Cash transaction CRUD
  - name: BudgetLine
    description: Budget line CRUD
  - name: EquipmentUsage
    description: Equipment usage tracking CRUD
  - name: MaterialConsumption
    description: Material consumption tracking CRUD
  - name: HR
    description: HR management (leaves, leave types, leave configs)
  - name: IncomeType
    description: Income type configuration
  - name: OtherExpenseType
    description: Other expense type configuration
  - name: IncomeReceipt
    description: Income receipt sub-resource
  - name: PurchaseOperation
    description: Compound purchase operation action
  - name: TravelOperation
    description: Compound travel operation action
  - name: Report
    description: Dashboard and reporting endpoints
  - name: Notification
    description: Notification CRUD

paths:

  # ╔══════════════════════════════════════════════════════════╗
  # ║  1. FEATURES (CRUD)                                           ║
  # ╚══════════════════════════════════════════════════════════╝

  /users/{userId}/companies/{companyId}/leaves:
    get:
      tags:
        - HR
      summary: Get all leaves
      operationId: getLeaves
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
        - name: user_id
          in: query
          schema:
            type: string
          example: "usr_123456"
        - name: leave_type_id
          in: query
          schema:
            type: string
          example: "leave_type_1"
        - name: status
          in: query
          schema:
            type: string
          example: "APPROVED"
        - name: year
          in: query
          schema:
            type: integer
          example: 2026
        - name: page
          in: query
          schema:
            $ref: '#/components/schemas/Page'
          example: 1
        - name: page_size
          in: query
          schema:
            $ref: '#/components/schemas/PageSize'
          example: 20
      responses:
        '200':
          description: List of leaves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
        - HR
      summary: Create or update leaves
      operationId: crupdateLeaves
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CrupdateLeave'
      responses:
        '200':
          description: The created or updated leaves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leave'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/{userId}/companies/{companyId}/leaves/{id}:
    get:
      tags:
        - HR
      summary: Get leave by identifier
      operationId: getLeaveById
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "leave_1"
      responses:
        '200':
          description: The identified leave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leave'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
        - HR
      summary: Delete leave by identifier
      operationId: deleteLeaveById
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "leave_1"
      responses:
        '204':
          description: Leave deleted successfully
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrupdateUser'
            example:
              first_name: "Jean"
              last_name: "Dupont"
              email: "jean.dupont@example.com"
              password: "securePassword123"
              role: "EMPLOYEE"
              sex: "M"
              comment: "Nouvel employé en CDI"
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                id: "usr_123456"
                email: "jean.dupont@example.com"
                role: "EMPLOYEE"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "jean.dupont@example.com"
              password: "securePassword123"
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                id: "usr_123456"
                email: "jean.dupont@example.com"
                role: "EMPLOYEE"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /auth/whoami:
    get:
      tags:
        - Auth
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                id: "usr_123456"
                email: "jean.dupont@example.com"
                role: "EMPLOYEE"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /auth/password:
    put:
      tags:
        - Auth
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed successfully
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'

  '/users/{id}':
    get:
      tags:
        - Users
      summary: Get user by identifier
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "usr_123456"
      responses:
        '200':
          description: The identified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "usr_123456"
                first_name: "Jean"
                last_name: "Dupont"
                email: "jean.dupont@example.com"
                role: "EMPLOYEE"
                sex: "M"
                comment: "Nouvel employé en CDI"
                created_at: "2024-01-15T09:30:00Z"
                updated_at: "2024-01-15T09:30:00Z"
                created_by:
                  id: "usr_admin001"
                  role: "ADMIN"
                  first_name: "Admin"
                  last_name: "System"
                  sex: "F"
                  email: "admin@company.com"
                updated_by:
                  id: "usr_admin001"
                  role: "ADMIN"
                  first_name: "Admin"
                  last_name: "System"
                  sex: "F"
                  email: "admin@company.com"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
        - Users
      summary: Delete a user by identifier
      operationId: deleteUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "usr_123456"
      responses:
        '204':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Page'
          example: 1
        - name: page_size
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PageSize'
          example: 20
        - name: company_id
          in: query
          required: false
          description: "Filter users by company ID"
          schema:
            type: string
          example: "comp_001"
        - name: first_name
          in: query
          required: false
          description: "Filter users by first name, case is ignored"
          schema:
            type: string
          example: "Jean"
        - name: last_name
          in: query
          required: false
          description: "Filter users by last name, case is ignored"
          schema:
            type: string
          example: "Dupont"
        - name: email
          in: query
          required: false
          description: "Filter users by email, case is ignored"
          schema:
            type: string
          example: "jean.dupont@example.com"
        - name: role
          in: query
          required: false
          description: "Filter users by role"
          schema:
            $ref: '#/components/schemas/Role'
          example: "EMPLOYEE"
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              example:
                - id: "usr_123456"
                  first_name: "Jean"
                  last_name: "Dupont"
                  email: "jean.dupont@example.com"
                  role: "EMPLOYEE"
                  sex: "M"
                  comment: "Nouvel employé en CDI"
                  created_at: "2024-01-15T09:30:00Z"
                  updated_at: "2024-01-15T09:30:00Z"
                  created_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                  updated_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                - id: "usr_123457"
                  first_name: "Marie"
                  last_name: "Martin"
                  email: "marie.martin@example.com"
                  role: "ADMINISTRATION"
                  sex: "F"
                  comment: "Responsable administrative"
                  created_at: "2024-01-10T14:20:00Z"
                  updated_at: "2024-01-12T11:00:00Z"
                  created_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                  updated_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
        - Users
      summary: Create new users or update existing users
      description: Update users when `id` are provided, create them otherwise.
      operationId: crupdateUsers
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
          example: "comp_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CrupdateUser'
            example:
              - id: "usr_123456"
                first_name: "Jean"
                last_name: "Dupont"
                email: "jean.dupont@example.com"
                role: "EMPLOYEE"
                sex: "M"
                password: "newPassword123"
                comment: "Mise à jour du profil"
              - first_name: "Pierre"
                last_name: "Durand"
                email: "pierre.durand@example.com"
                role: "WAREHOUSE_WORKER"
                sex: "M"
                password: "password123"
                comment: "Nouvel employé d'entrepôt"
      responses:
        '200':
          description: The created or updated users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - id: "usr_123456"
                  first_name: "Jean"
                  last_name: "Dupont"
                  email: "jean.dupont@example.com"
                  role: "EMPLOYEE"
                  sex: "M"
                  comment: "Mise à jour du profil"
                  created_at: "2024-01-15T09:30:00Z"
                  updated_at: "2024-02-20T15:45:00Z"
                  created_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                  updated_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                - id: "usr_123458"
                  first_name: "Pierre"
                  last_name: "Durand"
                  email: "pierre.durand@example.com"
                  role: "WAREHOUSE_WORKER"
                  sex: "M"
                  comment: "Nouvel employé d'entrepôt"
                  created_at: "2024-02-20T15:45:00Z"
                  updated_at: "2024-02-20T15:45:00Z"
                  created_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
                  updated_by:
                    id: "usr_admin001"
                    role: "ADMIN"
                    first_name: "Admin"
                    last_name: "System"
                    sex: "F"
                    email: "admin@company.com"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  '/users/{userId}/companies/{companyId}':
    get:
      tags:
        - Company
      summary: Get company by identifier
      operationId: getCompanyById
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
      responses:
        '200':
          description: The identified company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
              example:
                id: "comp_btp001"
                name: "BTP Construction Martin"
                rib: "FR76 1234 5678 9012 3456 7890 123"
                description: "Entreprise de construction spécialisée dans les bâtiments industriels"
                company_type: "BTP"
                comment: "Entreprise partenaire depuis 2020"
                created_at: "2024-01-10T08:00:00Z"
                updated_at: "2024-01-10T08:00:00Z"
                created_by:
                  id: "usr_admin001"
                  role: "ADMIN"
                  first_name: "Admin"
                  last_name: "System"
                  sex: "F"
                  email: "admin@company.com"
                updated_by:
                  id: "usr_admin001"
                  role: "ADMIN"
                  first_name: "Admin"
                  last_name: "System"
                  sex: "F"
                  email: "admin@company.com"
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
        - Company
      summary: Delete a company by identifier
      operationId: deleteCompanyById
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: companyId
          in: path
          required: true
          schema:
            type: string
          example: "comp_btp001"
      responses:
        '204':
          description: Company deleted successfully
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

  /users/{userId}/companies:
    get:
      tags:
        - Company
      summary: Get all companies for a user
      operationId: getCompanies
      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "user_123456"

        - name: page
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Page'
          example: 1
        - name: page_size
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PageSize'
          example: 20
        - name: name
          in: query
          required: false
          description: "Filter companies by name, case is ignored"
          schema:
            type: string
          example: "BTP Construction"
        - name: rib
          in: query
          required: false
          description: "Filter companies by RIB, case is ignored"
          schema:
            type: string
          example: "FR76 1234"
        - name: description
          in: query
          required: false
          description: "Filter companies by description, case is ignored"
          schema:
            type: string
          example: "construction"
        - name: company_type
          in: query
          required: false
          description: "Filter by company type"
          schema:
            $ref: '#/components/schemas/CompanyType'
          example: "BTP"
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              example:
                - id: "comp_btp001"
