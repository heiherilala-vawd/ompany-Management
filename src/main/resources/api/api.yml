        est_en_panne:
          type: boolean
          description: "Whether the equipment is broken"
          example: false
        purchase_price:
          type: number
          example: 150000.00
        purchase_date:
          type: string
          format: date
          example: "2024-01-15"
        category:
          type: string
          example: "Engins de terrassement"

