components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  responses:
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
          example:
            type: "BadRequestException"
            message: "Invalid request parameters"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
          example:
            type: "NotAuthorizedException"
            message: "You don't have permission to access this resource"
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundException'
          example:
            type: "ResourceNotFoundException"
            message: "Resource of type <User> identified by <usr_999999> not found"
    '429':
      description: Too many requests to the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsException'
          example:
            type: "TooManyRequestsException"
            message: "Rate limit exceeded. Please try again later."
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerException'
          example:
            type: "InternalServerException"
            message: "An unexpected error occurred"

  schemas:
    # =========================
    # ENUMS
    # =========================
    CompanyType:
      type: string
      enum:
        - BTP
        - HOTEL
      example: BTP
    EntityType:
      type: string
      enum:
        - USER
        - COMPANY
        - JOB
        - WAREHOUSE
        - EQUIPMENT
        - MATERIAL
        - INCOMEMONEY
        - INCOMETYPE
        - EXPENSEMONEY
        - EMPLOYEE_PAYMENT
        - TRAVEL_EXPENSE
        - TRAVELPEOPLE
        - TRAVELMATERIALS
        - TRAVELEQUIPMENT
        - PURCHASE
        - BANK_FEE
        - OTHER_EXPENSE
        - TEAM
        - OTHEREXPENSETYPE
        - COMPANYFIXEDCOST
        - LOAN
        - LOANREPAYMENT
        - INCOMERECEIPT
        - LEAVETYPE
        - EMPLOYEELEAVECONFIG
        - LEAVE
        - TASK
        - TASKASSIGNMENT
        - TASKSCHEDULE
        - DEPARTMENT
        - CASHACCOUNT
        - CASHTRANSACTION
        - BUDGETLINE
        - EQUIPMENTUSAGE
        - MATERIALCONSUMPTION
        - ORGANIZATION
        - PURCHASEORDER
        - PURCHASEORDERLINE
        - SUPPLIER
        - MAINTENANCESCHEDULE
        - NOTIFICATION
        - CAR
      example: JOB
    JobStatus:
      type: string
      enum:
        - PENDING_SIGNATURE
        - IN_PROGRESS
        - COMPLETED
      example: IN_PROGRESS
    PaymentType:
      type: string
      enum:
        - ADVANCE
        - MONTHLY
        - OTHER
      example: MONTHLY
    TransportStatus:
      type: string
      enum:
        - IN_PROGRESS
        - LOST
        - ARRIVED
        - DAMAGED
      example: ARRIVED
    Sex:
      type: string
      enum:
        - M
        - F
      example: M
    Role:
      type: string
      enum:
        - ADMIN
        - WAREHOUSE_WORKER
        - EMPLOYEE
        - ADMINISTRATION
      example: EMPLOYEE

    # =========================
    # COMMON
    # =========================
    comment:
      properties:
        comment:
          type: string
          example: "Commentaire sur cette entité"

    # =========================
    # DEPARTMENT
    # =========================
    Department:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "dept_001"
        name:
          type: string
          example: "Génie Civil"
        description:
          type: string
          example: "Département en charge des travaux de génie civil"
        company_id:
          type: string
          example: "comp_btp001"
    CrupdateDepartment:
      required:
        - name
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "dept_001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Génie Civil"
        company_id:
          type: string
          example: "comp_btp001"
        description:
          type: string
          example: "Département en charge des travaux de génie civil"

    # =========================
    # CASH ACCOUNT
    # =========================
    CashAccount:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "ca_001"
        name:
          type: string
          example: "Compte courant BNI"
        balance:
          type: number
          example: 1500000.00
        description:
          type: string
          example: "Compte bancaire principal"
        company_id:
          type: string
          example: "comp_btp001"
    CrupdateCashAccount:
      required:
        - name
        - balance
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "ca_001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Compte courant BNI"
        balance:
          type: number
          minimum: 0
          example: 1500000.00
        description:
          type: string
          example: "Compte bancaire principal"
        company_id:
          type: string
          example: "comp_btp001"

    # =========================
    # CASH TRANSACTION
    # =========================
    CashTransactionType:
      type: string
      enum:
        - CREDIT
        - DEBIT
    CashTransaction:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "ct_001"
        cash_account_id:
          type: string
          example: "ca_001"
        amount:
          type: number
          example: 500000.00
        transaction_date:
          type: string
          format: date
          example: "2024-06-15"
        description:
          type: string
          example: "Dépôt chèque client"
        type:
          $ref: '#/components/schemas/CashTransactionType'
    CrupdateCashTransaction:
      required:
        - cash_account_id
        - transaction_date
        - type
        - amount
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "ct_001"
        cash_account_id:
          type: string
          example: "ca_001"
        amount:
          type: number
          minimum: 0
          example: 500000.00
        transaction_date:
          type: string
          format: date
          example: "2024-06-15"
        description:
          type: string
          example: "Dépôt chèque client"
        type:
          $ref: '#/components/schemas/CashTransactionType'

    # =========================
    # BUDGET LINE
    # =========================
    BudgetLine:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "bl_001"
        company_id:
          type: string
          example: "comp_btp001"
        category:
          type: string
          example: "Matériaux"
        planned_amount:
          type: number
          example: 1000000.00
        actual_amount:
          type: number
          example: 950000.00
        period_start:
          type: string
          format: date
          example: "2024-01-01"
        period_end:
          type: string
          format: date
          example: "2024-03-31"
        description:
          type: string
          example: "Budget matériaux Q1 2024"
    CrupdateBudgetLine:
      required:
        - category
        - period_start
        - period_end
        - planned_amount
        - actual_amount
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "bl_001"
        company_id:
          type: string
          example: "comp_btp001"
        category:
          type: string
          minLength: 1
          maxLength: 255
          example: "Matériaux"
        planned_amount:
          type: number
          minimum: 0
          example: 1000000.00
        actual_amount:
          type: number
          minimum: 0
          example: 950000.00
        period_start:
          type: string
          format: date
          example: "2024-01-01"
        period_end:
          type: string
          format: date
          example: "2024-03-31"
        description:
          type: string
          example: "Budget matériaux Q1 2024"

    # =========================
    # EQUIPMENT USAGE
    # =========================
    UsageStatus:
      type: string
      enum:
        - IN_USE
        - BROKEN
        - RETURNED
        - LOST
      example: "RETURNED"
    EquipmentUsage:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "eu_001"
        equipment_id:
          type: string
          example: "eq_001"
        job_id:
          type: string
          example: "job_001"
        start_time:
          type: string
          format: date-time
          example: "2024-06-10T08:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2024-06-10T17:00:00Z"
        source_location:
          type: string
          example: "wh_001"
        usage_status:
          $ref: '#/components/schemas/UsageStatus'
        used_by:
          type: string
          example: "user_001"
    CrupdateEquipmentUsage:
      required:
        - equipment_id
        - job_id
        - start_time
        - source_location
        - usage_status
        - used_by
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "eu_001"
        equipment_id:
          type: string
          example: "eq_001"
        job_id:
          type: string
          example: "job_001"
        start_time:
          type: string
          format: date-time
          example: "2024-06-10T08:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2024-06-10T17:00:00Z"
        source_location:
          type: string
          minLength: 1
          maxLength: 255
          example: "wh_001"
        usage_status:
          type: string
          example: "COMPLETED"
        used_by:
          type: string
          example: "user_001"

    # =========================
    # MATERIAL CONSUMPTION
    # =========================
    MaterialConsumption:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "mc_001"
        material_id:
          type: string
          example: "mat_001"
        warehouse_id:
          type: string
          example: "wh_001"
        quantity:
          type: integer
          example: 50
        consumption_date:
          type: string
          format: date
          example: "2024-06-15"
        job_id:
          type: string
          example: "job_001"
        reason:
          type: string
          example: "Utilisation pour fondations"
        consumption_status:
          type: string
          example: "COMPLETED"
    CrupdateMaterialConsumption:
      required:
        - material_id
        - warehouse_id
        - quantity
        - consumption_date
        - job_id
        - consumption_status
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "mc_001"
        material_id:
          type: string
          example: "mat_001"
        warehouse_id:
          type: string
          example: "wh_001"
        quantity:
          type: integer
          minimum: 0
          example: 50
        consumption_date:
          type: string
          format: date
          example: "2024-06-15"
        job_id:
          type: string
          example: "job_001"
        reason:
          type: string
          example: "Utilisation pour fondations"
        consumption_status:
          type: string
          example: "COMPLETED"
    AuditUser:
      properties:
        id:
          type: string
          example: "usr_admin001"
        role:
          $ref: '#/components/schemas/Role'
        first_name:
          type: string
          example: "Admin"
        last_name:
          type: string
          example: "System"
        sex:
          $ref: '#/components/schemas/Sex'
        email:
          type: string
          example: "admin@company.com"
    AuditFields:
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T09:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-02-20T15:45:00Z"
        created_by:
          $ref: '#/components/schemas/AuditUser'
        updated_by:
          $ref: '#/components/schemas/AuditUser'

    # =========================
    # USER
    # =========================
    User:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "usr_123456"
        role:
          $ref: '#/components/schemas/Role'
        first_name:
          type: string
          example: "Jean"
        last_name:
          type: string
          example: "Dupont"
        sex:
          $ref: '#/components/schemas/Sex'
        email:
          type: string
          example: "jean.dupont@example.com"
        company_id:
          type: string
          example: "comp_001"
        birth_date:
          type: string
          format: date
          example: "1990-05-15"
        manager_id:
          type: string
          example: "usr_admin001"
        department_id:
          type: string
          example: "dept_001"
    CrupdateUser:
      required:
        - first_name
        - last_name
        - email
        - password
        - sex
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "usr_123456"
        role:
          $ref: '#/components/schemas/Role'
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Jean"
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Dupont"
        sex:
          $ref: '#/components/schemas/Sex'
        email:
          type: string
          format: email
          maxLength: 255
          example: "jean.dupont@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: "securePassword123"
        company_ids:
          type: array
          items:
            type: string
          example: ["comp_001"]
        birth_date:
          type: string
          format: date
          example: "1990-05-15"
        manager_id:
          type: string
          example: "usr_admin001"
        department_id:
          type: string
          example: "dept_001"

    # =========================
    # TEAM
    # =========================
    Team:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "team_001"
        name:
          type: string
          example: "Équipe chantier A"
        leader:
          $ref: '#/components/schemas/User'
        job_id:
          type: string
          example: "job_001"
        members:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CrupdateTeam:
      required:
        - name
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "team_001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Équipe chantier A"
        leader_id:
          type: string
          example: "usr_123456"
        job_id:
          type: string
          example: "job_001"
        member_ids:
          type: array
          items:
            type: string
          example: ["usr_123456", "usr_789012"]

    # =========================
    # COMPANY
    # =========================
    Company:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "comp_btp001"
        name:
          type: string
          example: "BTP Construction Martin"
        rib:
          type: string
          example: "FR76 1234 5678 9012 3456 7890 123"
        description:
          type: string
          example: "Entreprise de construction spécialisée dans les bâtiments industriels"
        company_type:
          $ref: '#/components/schemas/CompanyType'
    CrupdateCompany:
      required:
        - name
        - company_type
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "comp_btp001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "BTP Construction Martin"
        rib:
          type: string
          example: "FR76 1234 5678 9012 3456 7890 123"
        description:
          type: string
          example: "Entreprise de construction spécialisée dans les bâtiments industriels"
        company_type:
          $ref: '#/components/schemas/CompanyType'

    # =========================
    # JOB
    # =========================
    Job:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "job_001"
        company:
          $ref: '#/components/schemas/CrupdateCompany'
        description:
          type: string
          example: "Construction d'un entrepôt logistique de 5000m²"
        contract_signature_date:
          type: string
          format: date
          example: "2024-01-20"
        start_date:
          type: string
          format: date
          example: "2024-02-01"
        end_date:
          type: string
          format: date
          example: "2024-08-31"
        status:
          $ref: '#/components/schemas/JobStatus'
    CrupdateJob:
      required:
        - status
      allOf:
        - $ref: '#/components/schemas/comment'
      properties:
        id:
          type: string
          example: "job_001"
        company_id:
          type: string
          example: "comp_btp001"
        description:
          type: string
          example: "Construction d'un entrepôt logistique de 5000m²"
        contract_signature_date:
          type: string
          format: date
          example: "2024-01-20"
        start_date:
          type: string
          format: date
          example: "2024-02-01"
        end_date:
          type: string
          format: date
          example: "2024-08-31"
        status:
          $ref: '#/components/schemas/JobStatus'

    # =========================
    # WAREHOUSE
    # =========================
    Warehouse:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
      properties:
        id:
          type: string
          example: "wh_001"
        name:
          type: string
          example: "Entrepôt Nord"
        description:
          type: string
          example: "Entrepôt principal pour le chantier de Lyon"
