      properties:
        id:
          type: string
          example: "eq_001"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Pelleteuse CAT 320"
        description:
          type: string
          example: "Pelleteuse pour terrassement, 20 tonnes"
        warehouse_id:
          type: string
          example: "wh_001"
        floor_number:
          type: integer
          example: 1
        storage_number:
          type: integer
